<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Primary Tags -->
    <title>Pixel Art to JollyWorld Generator</title>
    <meta name="description" content="Create, edit, and convert pixel art into compressed JollyData output for JollyWorld right in your browser. Features PNG import, custom grid sizes, and drawing tools.">
    <meta name="author" content="Warze">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://warzedev.github.io/pixelArtToJollyData/">

    <!-- Theme & UI Styling -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#e9ecf2">

    <!-- Open Graph / Facebook / Discord / Slack -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://warzedev.github.io/pixelArtToJollyData/">
    <meta property="og:site_name" content="Pixel Art to JollyWorld">
    <meta property="og:title" content="Pixel Art to JollyWorld Editor">
    <meta property="og:description" content="A lightweight browser-based pixel-art editor with PNG import, drawing tools, and JollyData generation.">
    <meta property="og:image" content="https://warzedev.github.io/pixelArtToJollyData/screenshot.png">
    <meta property="og:image:secure_url" content="https://warzedev.github.io/pixelArtToJollyData/screenshot.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1365"> 
    <meta property="og:image:height" content="954">
    <meta property="og:image:alt" content="Screenshot of the Pixel Art to JollyData editor interface">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@warzedev">
    <meta name="twitter:creator" content="@warzedev">
    <meta name="twitter:title" content="Pixel Art to JollyWorld Editor">
    <meta name="twitter:description" content="Create pixel art in your browser and convert your drawings into compressed JollyData output for JollyWorld.">
    <meta name="twitter:image" content="https://warzedev.github.io/pixelArtToJollyData/screenshot.png">

    <!-- Favicons & Styles -->
    <link rel="icon" type="image/png" href="love.png">
    <link rel="stylesheet" href="styles.css">

    <!-- Theme Initialization Script -->
    <script>
        /* Set the theme before first paint to avoid a flash */
        try {
            var t = localStorage.getItem('theme');
            if (t !== 'light' && t !== 'dark') {
                t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
    <script type="text/javascript" src="lzstring.min.js"></script>
</head>
<body>
    <!-- SVG icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
        <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2Z"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
        <symbol id="i-braces" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
        <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
        <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9Z"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
        <symbol id="i-shapes" viewBox="0 0 24 24"><path d="m12 3 5 8H7Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></symbol>
        <symbol id="i-bucket" viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></symbol>
        <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19 19 5"/></symbol>
        <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></symbol>
        <symbol id="i-frect" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1" fill="currentColor"/></symbol>
        <symbol id="i-pipette" viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13"/></symbol>
        <symbol id="i-flip-h" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 20v2M12 14v2M12 8v2M12 2v2"/></symbol>
        <symbol id="i-flip-v" viewBox="0 0 24 24"><path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/><path d="M4 12H2M10 12H8M16 12h-2M22 12h-2"/></symbol>
        <symbol id="i-rot-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
        <symbol id="i-rot-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
        <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
        <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
        <symbol id="i-arrow-u" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
        <symbol id="i-arrow-d" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
        <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></symbol>
        <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    </svg>

    <header class="topbar">
        <div class="brand">
            <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
                <rect x="2" y="2" width="11" height="11" rx="2" fill="var(--accent)"/>
                <rect x="15" y="2" width="11" height="11" rx="2" fill="var(--ink)" opacity=".18"/>
                <rect x="2" y="15" width="11" height="11" rx="2" fill="var(--ink)" opacity=".18"/>
                <rect x="15" y="15" width="11" height="11" rx="2" fill="var(--accent)"/>
            </svg>
            <h1>Pixel Art to JollyWorld</h1>
        </div>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch to dark mode" title="Toggle light / dark">
            <svg class="ico ico-moon" aria-hidden="true"><use href="#i-moon"/></svg>
            <svg class="ico ico-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
    </header>

    <div class="layout">
        <main class="workspace">
            <div id="container" class="stage" aria-label="Pixel canvas">
                <div id="view" class="view">
                    <canvas id="screen"></canvas>
                    <canvas id="preview"></canvas>
                    <div id="cursor" hidden></div>
                </div>
                <div class="zoombar">
                    <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out" title="Zoom out (-)"><svg class="ico" aria-hidden="true"><use href="#i-zoom-out"/></svg></button>
                    <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in" title="Zoom in (+)"><svg class="ico" aria-hidden="true"><use href="#i-zoom-in"/></svg></button>
                    <button id="zoom-fit" class="icon-btn" type="button" aria-label="Reset zoom" title="Reset zoom (0)"><svg class="ico" aria-hidden="true"><use href="#i-expand"/></svg></button>
                </div>
            </div>
        </main>

        <aside class="controls">
            <section class="sec">
                <h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-pencil"/></svg>Tool</h2>
                <div class="seg tools" role="group" aria-label="Drawing tool">
                    <button type="button" data-tool="draw" aria-pressed="true" aria-label="Draw" title="Draw (D)"><svg class="ico" aria-hidden="true"><use href="#i-pencil"/></svg></button>
                    <button type="button" data-tool="erase" aria-pressed="false" aria-label="Erase" title="Erase (E)"><svg class="ico" aria-hidden="true"><use href="#i-eraser"/></svg></button>
                    <button type="button" data-tool="fill" aria-pressed="false" aria-label="Fill" title="Fill (F)"><svg class="ico" aria-hidden="true"><use href="#i-bucket"/></svg></button>
                    <button type="button" data-tool="line" aria-pressed="false" aria-label="Line" title="Line (L)"><svg class="ico" aria-hidden="true"><use href="#i-line"/></svg></button>
                    <button type="button" data-tool="rect" aria-pressed="false" aria-label="Rectangle" title="Rectangle (R)"><svg class="ico" aria-hidden="true"><use href="#i-rect"/></svg></button>
                    <button type="button" data-tool="frect" aria-pressed="false" aria-label="Filled rectangle" title="Filled rectangle (Shift+R)"><svg class="ico" aria-hidden="true"><use href="#i-frect"/></svg></button>
                    <button type="button" data-tool="pick" aria-pressed="false" aria-label="Eyedropper" title="Eyedropper (I, or Alt+click)"><svg class="ico" aria-hidden="true"><use href="#i-pipette"/></svg></button>
                </div>
                <div class="iconrow">
                    <button id="undo" class="btn" type="button" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg class="ico" aria-hidden="true"><use href="#i-undo"/></svg></button>
                    <button id="redo" class="btn" type="button" aria-label="Redo" title="Redo (Ctrl+Y)" disabled><svg class="ico" aria-hidden="true"><use href="#i-redo"/></svg></button>
                    <button id="clear" class="btn" type="button" aria-label="Clear canvas" title="Clear the whole canvas"><svg class="ico" aria-hidden="true"><use href="#i-trash"/></svg></button>
                </div>
                <p class="hint">Left click draws, right click erases.</p>
            </section>

            <section class="sec">
                <h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-palette"/></svg>Color</h2>
                <div class="colorrow">
                    <input id="color" type="color" value="#888888" aria-label="Drawing color">
                    <span id="colortext" class="hex">#888888</span>
                </div>
                <div id="palette" class="palette" role="group" aria-label="Recently used colors"></div>
            </section>

            <section class="sec">
                <h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-rot-cw"/></svg>Transform</h2>
                <div class="iconrow four">
                    <button id="flip-h" class="btn" type="button" aria-label="Flip horizontally" title="Flip horizontally"><svg class="ico" aria-hidden="true"><use href="#i-flip-h"/></svg></button>
                    <button id="flip-v" class="btn" type="button" aria-label="Flip vertically" title="Flip vertically"><svg class="ico" aria-hidden="true"><use href="#i-flip-v"/></svg></button>
                    <button id="rot-ccw" class="btn" type="button" aria-label="Rotate left" title="Rotate left"><svg class="ico" aria-hidden="true"><use href="#i-rot-ccw"/></svg></button>
                    <button id="rot-cw" class="btn" type="button" aria-label="Rotate right" title="Rotate right"><svg class="ico" aria-hidden="true"><use href="#i-rot-cw"/></svg></button>
                    <button id="sh-l" class="btn" type="button" aria-label="Shift left" title="Shift left (Left arrow)"><svg class="ico" aria-hidden="true"><use href="#i-arrow-l"/></svg></button>
                    <button id="sh-r" class="btn" type="button" aria-label="Shift right" title="Shift right (Right arrow)"><svg class="ico" aria-hidden="true"><use href="#i-arrow-r"/></svg></button>
                    <button id="sh-u" class="btn" type="button" aria-label="Shift up" title="Shift up (Up arrow)"><svg class="ico" aria-hidden="true"><use href="#i-arrow-u"/></svg></button>
                    <button id="sh-d" class="btn" type="button" aria-label="Shift down" title="Shift down (Down arrow)"><svg class="ico" aria-hidden="true"><use href="#i-arrow-d"/></svg></button>
                </div>
            </section>

            <section class="sec">
                <h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-upload"/></svg>Import / export</h2>
                <div class="importrow">
                    <label class="btn file-btn">
                        <svg class="ico" aria-hidden="true"><use href="#i-upload"/></svg>
                        <span>Choose PNG</span>
                        <input id="image" class="sr-only" type="file" accept="image/png">
                    </label>
                    <button id="importdata" class="btn" type="button" aria-label="Import JollyData" title="Import JollyData"><svg class="ico" aria-hidden="true"><use href="#i-braces"/></svg></button>
                    <button id="export" class="btn" type="button" aria-label="Export PNG" title="Export PNG"><svg class="ico" aria-hidden="true"><use href="#i-download"/></svg></button>
                </div>
            </section>

            <section class="sec">
                <div class="field">
                    <div class="field-head">
                        <label for="wtext"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>Canvas width</label>
                        <input id="wtext" class="num" type="number" inputmode="numeric" min="1" max="128" step="1" value="16">
                    </div>
                    <input id="wslider" min="1" max="128" step="1" value="16" type="range" aria-label="Canvas width slider">
                </div>
                <div class="field">
                    <div class="field-head">
                        <label for="htext"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>Canvas height</label>
                        <input id="htext" class="num" type="number" inputmode="numeric" min="1" max="128" step="1" value="16">
                    </div>
                    <input id="hslider" min="1" max="128" step="1" value="16" type="range" aria-label="Canvas height slider">
                </div>
                <div class="field">
                    <div class="field-head">
                        <label for="igmtext"><svg class="ico" aria-hidden="true"><use href="#i-expand"/></svg>In-game size</label>
                        <input id="igmtext" class="num" type="number" inputmode="numeric" min="1" max="64" step="1" value="8">
                    </div>
                    <input id="igm" min="1" max="64" step="1" value="8" type="range" aria-label="In-game size slider">
                </div>
            </section>

            <section class="sec">
                <button id="generate" class="gen" type="button">
                    <svg class="ico" aria-hidden="true"><use id="genicon" href="#i-zap"/></svg>
                    <span id="genlabel">Generate</span>
                </button>
                <div id="outwrap" class="out" hidden>
                    <div class="out-head">
                        <p id="countline" class="count" aria-live="polite">
                            <svg id="countico" class="ico" aria-hidden="true"><use id="countuse" href="#i-shapes"/></svg><span id="shapecount"></span>
                        </p>
                        <button id="copy" class="icon-btn" type="button" aria-label="Copy output" title="Copy output">
                            <svg class="ico" aria-hidden="true"><use id="copyicon" href="#i-copy"/></svg>
                        </button>
                    </div>
                    <textarea id="output" readonly spellcheck="false" aria-label="JollyData output"></textarea>
                </div>
            </section>

            <footer class="credit">
                <span>Made with</span>
                <svg class="ico heart" aria-label="love" role="img"><use href="#i-heart"/></svg>
                <span>by <a href="https://warze.org" target="_blank" rel="noopener">Warze</a></span>
                <span>for <a href="https://jollyworld.app" target="_blank" rel="noopener">JollyWorld</a></span>
            </footer>
        </aside>
    </div>

    <dialog id="resizedlg" class="dlg" aria-labelledby="resizetitle">
        <form method="dialog">
            <h2 id="resizetitle">Resize canvas?</h2>
            <p id="resizemsg"></p>
            <div class="dlg-actions">
                <button id="resize-yes" class="btn primary" type="submit" value="resize"></button>
                <button id="resize-no" class="btn" type="submit" value="keep"></button>
                <button class="btn" type="submit" value="cancel">Cancel import</button>
            </div>
        </form>
    </dialog>

    <dialog id="datadlg" class="dlg" aria-labelledby="datatitle">
        <form method="dialog">
            <h2 id="datatitle">Import JollyData</h2>
            <textarea id="datain" spellcheck="false" aria-label="Paste JollyData"></textarea>
            <p id="dataerr" class="err" hidden></p>
            <div class="dlg-actions">
                <button id="data-go" class="btn primary" type="button">Import</button>
                <button class="btn" type="submit" value="cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <script src="main.js"></script>
</body>
</html>
